<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#050505"/>
  <g transform="skewX(-10) translate(40, 20)">
    <!-- 3D Shadow Layers -->
    <text x="50" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="#111111" dx="12" dy="12">RNJ</text>
    <text x="50" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="#222222" dx="6" dy="6">RNJ</text>

    <!-- Letter R: Red -->
    <text x="50" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="#ff2a2a">R</text>

    <!-- Letter N: Yellow -->
    <text x="135" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="#ffd60a">N</text>

    <!-- Letter J: Light Blue -->
    <text x="220" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="#38bdf8">J</text>
  </g>

  <!-- Subtitles -->
  <text x="250" y="360" font-family="'Arial Black', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">TABERNÁCULO DE DAVI</text>
  <text x="250" y="400" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="32" fill="#ffffff" text-anchor="middle">Home Worship</text>
</svg>
