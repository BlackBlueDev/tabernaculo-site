<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#050505"/>
  <g transform="skewX(-8) translate(30, 20)">
    <!-- 3D Shadow Layers -->
    <text x="30" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="#111111" dx="10" dy="10">KIDS</text>
    <text x="30" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="#222222" dx="5" dy="5">KIDS</text>

    <!-- Letter K: Red -->
    <text x="30" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="#ff2a2a">K</text>

    <!-- Letter I: Yellow -->
    <text x="110" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="#ffd60a">I</text>

    <!-- Letter D: Light Blue -->
    <text x="160" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="#38bdf8">D</text>

    <!-- Letter S: Pink -->
    <text x="245" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" fill="#ff69b4">S</text>
  </g>

  <!-- Subtitles -->
  <text x="250" y="360" font-family="'Arial Black', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">TABERNÁCULO DE DAVI</text>
  <text x="250" y="400" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="32" fill="#ffffff" text-anchor="middle">Home Worship</text>
</svg>
