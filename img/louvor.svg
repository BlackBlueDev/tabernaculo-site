<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#050505"/>
  
  <!-- Musical note / Crown Graphic -->
  <g transform="translate(180, 80) scale(1.4)">
    <path d="M40 100 C 40 40, 80 20, 100 20 L 100 80 C 80 80, 60 90, 60 110 C 60 130, 80 140, 90 120 L 90 40 C 130 30, 150 70, 150 100 L 150 140 C 130 140, 110 130, 110 110 L 110 50" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="50" cy="110" r="16" fill="#94a3b8"/>
    <circle cx="100" cy="100" r="16" fill="#64748b"/>
  </g>

  <g transform="skewX(-6) translate(30, 30)">
    <!-- 3D Shadow Layers -->
    <text x="250" y="290" font-family="'Impact', 'Arial Black', sans-serif" font-size="70" font-weight="900" fill="#111111" text-anchor="middle" dx="6" dy="6">LOUVOR</text>
    
    <!-- Lettering in Graphite Metallic Accent -->
    <text x="250" y="290" font-family="'Impact', 'Arial Black', sans-serif" font-size="70" font-weight="900" fill="#cbd5e1" text-anchor="middle">LOUVOR</text>
  </g>

  <!-- Subtitles -->
  <text x="250" y="360" font-family="'Arial Black', sans-serif" font-size="22" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="3">TABERNÁCULO DE DAVI</text>
  <text x="250" y="400" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="32" fill="#ffffff" text-anchor="middle">Home Worship</text>
</svg>
